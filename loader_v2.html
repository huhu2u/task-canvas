<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粤闽浙渠道 任务管理中心</title>
<style>
body,html{margin:0;padding:0;height:100%;background:#0d1117;}
iframe{width:100%;height:100vh;border:none;}
#msg{display:flex;align-items:center;justify-content:center;height:100vh;color:#60c8ff;font-family:sans-serif;font-size:14px;}
</style>
</head>
<body>
<div id="msg">⏳ 加载中...</div>
<script>
const S3 = '';
fetch(S3)
  .then(r => r.arrayBuffer())
  .then(buf => {
    const blob = new Blob([buf], {type: 'text/html; charset=utf-8'});
    const url  = URL.createObjectURL(blob);
    const ifr  = document.createElement('iframe');
    ifr.src    = url;
    ifr.style  = 'position:fixed;top:0;left:0;width:100%;height:100%;border:none;';
    document.body.innerHTML = '';
    document.body.appendChild(ifr);
  })
  .catch(e => {
    document.getElementById('msg').textContent = '加载失败: ' + e;
  });
</script>
</body>
</html>
